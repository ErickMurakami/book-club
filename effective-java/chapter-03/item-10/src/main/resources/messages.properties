# Log message templates. Placeholders are JBoss logging printf style (%s), not MessageFormat:
# these strings are fed straight to Log.debugf/infof/warnf.

consistency.reservation.compare=ReservationSnapshot[%s].equals -> %s (immutable state, nothing changed)
consistency.priceQuote.liveLookup=FlakyPriceQuote[%s] queried the live price -> %s

nonnullity.ticket.rejectedByInstanceof=Ticket[%s].equals rejected %s via instanceof - no explicit null check needed

recipe.phoneNumber.sameReference=equals on %s: same reference (==) - short-circuit true
recipe.phoneNumber.wrongTypeOrNull=equals on %s: argument %s is not a PhoneNumber (or is null) - false via instanceof
recipe.phoneNumber.fieldsCompared=equals between %s and %s: fields compared -> %s
recipe.phoneBook.registered=PhoneBookRegistry: %s registered for "%s"
recipe.phoneBook.lookup=PhoneBookRegistry: lookup for %s -> %s

performance.polygon.areaShortCircuit=areas differ (%s vs %s) - no vertex will be compared
